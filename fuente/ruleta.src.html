<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruleta de Fin de Año</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icono.png">
<!-- tema antes de pintar + conexión con el servidor (api, PIN) -->
<script src="comun.js"></script>
<script src="sonidos.js"></script>
<script>
  // viene del botón EMPEZAR del inicio: animación de entrada (y se limpia el #jugar de la dirección)
  if (location.hash === "#jugar") {
    document.documentElement.classList.add("entrada");
    window.__entrada = true;
    history.replaceState(null, "", location.pathname);
    // seguro: la cortina nunca se queda si el navegador pausa animaciones (todo termina antes de 1.8 s)
    setTimeout(() => document.documentElement.classList.remove("entrada"), 1800);
  }
</script>
<style>
  :root{
    --green:#56b167; --green-d:#3d8f4d; --green-dd:#2e6e3b; --lime:#a3c91d; --navy:#0b0146;
    --bg:#eef5ec; --bg2:#f8fbf6; --surface:#ffffff; --surface2:#f1f6ef; --text:#0b0146; --muted:#5d5a7a;
    --line:rgba(11,1,70,.10); --shadow:0 1.2vh 3vh rgba(11,1,70,.08); --particle:rgba(86,177,103,.35);
    --logo-bg:transparent;
    /* 1u = 1% del alto del escenario 16:9 */
    --u:min(1vh,.5625vw);
  }
  @supports (height:1dvh){ :root{ --u:min(1dvh,.5625vw) } }
  :root[data-theme="dark"]{
    --bg:#060620; --bg2:#0d0d33; --surface:#13134a; --surface2:#1b1b5a; --text:#eef1ff; --muted:#a9abd0;
    --line:rgba(255,255,255,.12); --shadow:0 1.2vh 3vh rgba(0,0,0,.35); --particle:rgba(163,201,29,.3);
    --logo-bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Barlow',system-ui,sans-serif; color:var(--text);
    background:radial-gradient(ellipse at 15% 10%,var(--bg2),transparent 60%),
               radial-gradient(ellipse at 85% 90%,color-mix(in srgb,var(--green) 14%,transparent),transparent 55%),var(--bg);
    display:grid; place-items:center; transition:background-color .3s;
  }
  button,input,textarea{font:inherit;color:inherit}

  .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .particle{position:absolute;bottom:-20px;border-radius:50%;background:var(--particle);opacity:0;animation:rise linear infinite;will-change:transform,opacity}
  @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:.7}100%{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}

  /* ---------- Escenario 16:9 ---------- */
  .stage{
    position:relative; z-index:1; width:100vw; height:calc(var(--u)*100); /* alto 16:9, ancho completo: columnas pegadas a los bordes */
    padding:calc(var(--u)*3) calc(var(--u)*3.5);
    display:grid; gap:calc(var(--u)*2) calc(var(--u)*3);
    grid-template-columns:calc(var(--u)*40) minmax(0,1fr) calc(var(--u)*34);
    grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"brand wheel parts" "ctrl wheel parts" "win wheel parts";
  }
  .panel{display:contents}
  .brand{grid-area:brand;display:flex;flex-direction:column;gap:calc(var(--u)*1.6)}
  .logo{height:calc(var(--u)*9);width:auto;align-self:flex-start;background:var(--logo-bg);
    padding:calc(var(--u)*.6) calc(var(--u)*1.2);border-radius:calc(var(--u)*1.4)}
  :root:not([data-theme="dark"]) .logo{padding:0}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(var(--u)*5.2);line-height:1.02;
    color:var(--navy);letter-spacing:.01em}
  :root[data-theme="dark"] h1{color:#fff}
  h1 span{color:var(--green)}
  .sub{color:var(--muted);font-size:calc(var(--u)*2.2);line-height:1.3}

  .ctrl{grid-area:ctrl;display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
  .premio-actual{display:flex;flex-direction:column;gap:calc(var(--u)*.4);padding:calc(var(--u)*1) calc(var(--u)*2);border-radius:calc(var(--u)*2);
    border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
  .premio-actual .lbl{font-size:calc(var(--u)*1.6);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .premio-actual select,.sin-premio{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(var(--u)*3);color:var(--text);
    background:transparent;border:none;outline:none;width:100%;cursor:pointer;text-decoration:none;text-overflow:ellipsis}
  .premio-actual select option{font-size:16px;color:#0b0146;background:#fff}
  .premio-actual:focus-within{border-color:var(--green)}
  .spin-btn{
    font-family:'Barlow Condensed',sans-serif;font-size:calc(var(--u)*4.2);font-weight:700;letter-spacing:.1em;
    border:none;cursor:pointer;color:#fff;padding:calc(var(--u)*1.4) 0;border-radius:999px;
    background:linear-gradient(180deg,#7fca8c,var(--green) 50%,var(--green-d));
    box-shadow:0 calc(var(--u)*.8) 0 var(--green-dd),0 calc(var(--u)*1.6) calc(var(--u)*3) rgba(11,1,70,.25),inset 0 2px 0 rgba(255,255,255,.45);
    transition:transform .12s,box-shadow .12s,filter .2s;position:relative;
    text-shadow:0 2px 0 rgba(0,0,0,.15)
  }
  /* pulso: un aro aparte que crece y se desvanece (transform/opacity, sin repintar el botón) */
  .spin-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    border:calc(var(--u)*.6) solid rgba(86,177,103,.6);will-change:transform,opacity;animation:pulse 2s ease-out infinite}
  .spin-btn:disabled::after{display:none}
  .spin-btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}
  .spin-btn:active:not(:disabled){transform:translateY(calc(var(--u)*.6));box-shadow:0 calc(var(--u)*.2) 0 var(--green-dd)}
  .spin-btn:disabled{filter:grayscale(.5) brightness(.9);cursor:not-allowed;animation:none}
  .spin-btn:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
  @keyframes pulse{0%{transform:scale(1);opacity:1}70%,100%{transform:scale(1.08,1.45);opacity:0}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.2);
    box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
  .card h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(var(--u)*3);margin-bottom:calc(var(--u)*1.2);
    display:flex;align-items:center;gap:calc(var(--u)*1)}
  .badge{font-family:'Barlow',sans-serif;font-size:calc(var(--u)*1.7);font-weight:600;background:var(--surface2);color:var(--green-d);
    border-radius:999px;padding:calc(var(--u)*.3) calc(var(--u)*1.1)}
  :root[data-theme="dark"] .badge{color:var(--lime)}
  .win{grid-area:win}
  .parts{grid-area:parts;align-self:start;max-height:calc(100% - var(--u)*6.4);margin-top:calc(var(--u)*6.4)} /* espacio arriba para tema/sonido */
  .empty{color:var(--muted);font-size:calc(var(--u)*1.9)}
  .winners{list-style:none;display:flex;flex-direction:column;gap:calc(var(--u)*.9);overflow:auto;min-height:0}
  .winners li{display:flex;gap:calc(var(--u)*1.2);align-items:center;background:var(--surface2);
    padding:calc(var(--u)*1) calc(var(--u)*1.4);border-radius:calc(var(--u)*1.4);font-size:calc(var(--u)*2);
    animation:slidein .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes slidein{from{opacity:0;transform:translateX(30px) scale(.9)}to{opacity:1;transform:none}}
  .winners .n{background:var(--lime);color:var(--navy);font-weight:700;border-radius:50%;
    width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);display:grid;place-items:center;font-size:calc(var(--u)*1.6);flex:none}
  .winners .t{font-weight:600;min-width:0}
  .winners .t small{display:block;font-weight:400;color:var(--muted)}
  .winners .h{margin-left:auto;font-size:calc(var(--u)*1.5);color:var(--muted);flex:none}

  .plegar{margin-left:auto;white-space:nowrap;flex:none;font-family:'Barlow',sans-serif;font-size:calc(var(--u)*1.6);font-weight:600;cursor:pointer;
    background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:calc(var(--u)*.4) calc(var(--u)*1.2)}
  .plegar:hover{border-color:var(--green)}
  .plegar:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
  .plist{list-style:none;flex:0 1 auto;min-height:0;overflow:auto;margin:calc(var(--u)*1) 0;border-radius:calc(var(--u)*1.4);
    background:var(--surface2);padding:calc(var(--u)*1) calc(var(--u)*1.4);font-size:calc(var(--u)*1.8);line-height:1.45}
  .plist:empty{display:none}
  .err{color:#c62f3a;font-size:calc(var(--u)*1.7);margin-bottom:calc(var(--u)*.6)}
  :root[data-theme="dark"] .err{color:#ff6b75}
  .row{display:flex;gap:calc(var(--u)*1)}
  .btn{flex:1;border:none;border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.2) calc(var(--u)*1.6);font-size:calc(var(--u)*1.9);
    font-weight:600;cursor:pointer;background:var(--green);color:#fff;transition:transform .12s,filter .2s;text-decoration:none;text-align:center}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* herramientas (tema, sonido, menú) */
  .tools{position:absolute;z-index:5;top:calc(var(--u)*3);right:calc(var(--u)*3.5);display:flex;gap:calc(var(--u)*.8)}
  .icon-btn{border:1px solid var(--line);border-radius:50%;width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);
    font-size:calc(var(--u)*2.2);cursor:pointer;background:var(--surface2);display:grid;place-items:center}
  .icon-btn.menu{display:none}
  .drawer-head{display:none}
  .scrim{display:none}

  /* ---------- Ruleta ---------- */
  .wheel-area{grid-area:wheel;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2);min-height:0;min-width:0}
  .wheel-box{flex:1;min-height:0;width:100%;container-type:size;display:grid;place-items:center}
  /* nombre bajo la flecha: tamaño fijo (contain) para que cambiar el texto no reacomode la página */
  .nombre-actual{flex:none;height:calc(var(--u)*6.5);width:min(100%,calc(var(--u)*72));contain:strict;
    padding:0 calc(var(--u)*3);border-radius:999px;background:var(--surface);border:calc(var(--u)*.35) solid var(--green);
    box-shadow:var(--shadow);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(var(--u)*3.8);
    line-height:calc(var(--u)*5.8);text-align:center;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background-color .3s,color .3s,border-color .3s}
  .nombre-actual::before{content:"▲ ";color:var(--green);font-size:.6em;vertical-align:.15em}
  .nombre-actual:empty{visibility:hidden}
  .nombre-actual.gano{background:var(--green);color:#fff;border-color:var(--lime)}
  .nombre-actual.gano::before{color:var(--lime)}
  /* cada capa se pinta una vez; las animaciones solo usan transform/opacity (las hace la GPU) */
  .wheel-wrap{position:relative;width:min(100cqw,100cqh);aspect-ratio:1;will-change:transform;
    animation:float 5s ease-in-out infinite;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .wheel-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 1.5vh 3vh rgba(11,1,70,.25)}
  :root[data-theme="dark"] .wheel-wrap::before{box-shadow:0 1.5vh 3vh rgba(0,0,0,.55)}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.6%)}}
  .wheel-wrap.dragging{cursor:grabbing;animation-play-state:paused}
  .wheel-wrap svg{display:block;width:100%;height:100%;overflow:visible}
  .w-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .disc{will-change:transform;transform-origin:50% 50%}
  .pointer{position:absolute;left:45%;top:-1.667%;width:10%;height:13.333%;transform-origin:50% 55%;will-change:transform;pointer-events:none}
  .bulbs{will-change:opacity;animation:blink 1s steps(1) infinite}
  .bulbs-b{animation-delay:-.5s}
  .fast .bulbs{animation-duration:.25s}
  .fast .bulbs-b{animation-delay:-.125s}
  @keyframes blink{0%{opacity:1}50%{opacity:0}}

  /* ---------- Ganador: pantalla completa, pensada para proyector ---------- */
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay{position:fixed;inset:0;z-index:20;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3vh;padding:4vh 2vw;text-align:center;color:#fff;cursor:pointer;
    background:radial-gradient(circle at 50% 48%,#2a8a4a 0%,#0b0146 60%,#04011f 100%);animation:fade .2s ease}
  .overlay::before{content:"";position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;
    z-index:-1;pointer-events:none;will-change:transform;
    background:repeating-conic-gradient(from 0deg,rgba(163,201,29,.18) 0 8deg,transparent 8deg 16deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);
    animation:rays 22s linear infinite}
  @keyframes rays{to{transform:rotate(360deg)}}
  .overlay::after{content:"";position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash .7s ease-out forwards}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .win-icon{height:11vh;filter:drop-shadow(0 0 3vh rgba(163,201,29,.7));
    animation:spinpop .7s cubic-bezier(.2,1.6,.4,1) both,bob 1.6s ease-in-out .7s infinite}
  @keyframes spinpop{0%{transform:scale(0) rotate(-360deg)}100%{transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-1.5vh) rotate(6deg)}}
  .win-kicker{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3em;
    font-size:clamp(20px,6.5vh,80px);line-height:1;color:var(--lime);text-shadow:0 0 3vh rgba(163,201,29,.65);
    animation:drop .6s cubic-bezier(.2,1.6,.4,1) .1s both}
  @keyframes drop{0%{transform:translateY(-10vh) scale(.5);opacity:0}100%{transform:none;opacity:1}}
  .win-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;line-height:.92;
    max-width:96vw;margin:0;animation:shake .5s ease var(--land) both}
  .win-name .w{display:inline-block;white-space:nowrap;margin:0 .14em}
  .win-name .ch{display:inline-block;
    text-shadow:0 .035em 0 #3d8f4d,0 .07em 0 #2e6e3b,0 .1em 0 #1d4a28,0 .14em .12em rgba(0,0,0,.5),0 0 .4em rgba(163,201,29,.5);
    will-change:transform,opacity;
    animation:zoomin .8s cubic-bezier(.16,1.45,.4,1) var(--d) both,wave 2.2s ease-in-out calc(var(--land) + var(--d)) infinite}
  @keyframes zoomin{0%{transform:scale(8) rotate(var(--r));opacity:0}50%{opacity:1}100%{transform:none;opacity:1}}
  /* desenfoque de entrada solo en equipos con mouse (en celular el blur de letras gigantes es muy costoso) */
  @media (hover:hover) and (pointer:fine){
    @keyframes zoomin{0%{transform:scale(8) rotate(var(--r));opacity:0;filter:blur(.12em)}
      50%{opacity:1;filter:blur(0)}100%{transform:none;opacity:1}}
  }
  @keyframes wave{0%,100%{transform:none}50%{transform:translateY(-.06em) scale(1.07)}}
  /* con el ganador en pantalla, lo de atrás no se pinta */
  body:has(.overlay) .stage, body:has(.overlay) .particles{visibility:hidden}
  @keyframes shake{0%,100%{transform:none}15%{transform:translate(-1.2vw,.6vh) rotate(-1.2deg)}35%{transform:translate(1.1vw,-.6vh) rotate(1deg)}
    55%{transform:translate(-.6vw,.3vh)}75%{transform:translate(.4vw,0)}}
  .win-gift{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(20px,6vh,72px);line-height:1.1;
    background:var(--lime);color:var(--navy);padding:.15em .8em;border-radius:999px;max-width:94vw;
    box-shadow:0 1vh 4vh rgba(0,0,0,.35);animation:drop .6s cubic-bezier(.2,1.6,.4,1) var(--land) both}
  .win-btn{font:600 clamp(14px,2.6vh,30px) 'Barlow',sans-serif;padding:.5em 2em;border-radius:999px;cursor:pointer;
    border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);color:#fff;animation:fade .5s ease var(--land) both}
  .win-btn:hover,.win-btn:focus-visible{background:rgba(255,255,255,.22);outline:none}
  canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

  /* ---------- Celular / pantallas verticales: solo la ruleta, ajustes en cajón ---------- */
  @media (max-aspect-ratio:1/1), (max-height:520px){
    :root{--u:min(1dvh,2vw)}
    .stage{width:100vw;height:100dvh;padding:calc(var(--u)*2) 4vw calc(var(--u)*3);
      grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
      grid-template-areas:"brand" "wheel" "ctrl";gap:calc(var(--u)*2)}
    .brand{padding-right:calc(var(--u)*17)}
    .logo{height:calc(var(--u)*6)}
    h1{font-size:calc(var(--u)*3.6)}
    .sub{display:none}
    .ctrl{width:min(100%,420px);justify-self:center}
    .tools{top:calc(var(--u)*2);right:4vw}
    .icon-btn{width:44px;height:44px;font-size:20px}
    .icon-btn.menu{display:grid}
    .panel{display:flex;flex-direction:column;gap:14px;position:fixed;z-index:15;top:0;right:0;height:100dvh;
      width:min(88vw,380px);padding:16px;background:var(--bg);box-shadow:-10px 0 40px rgba(0,0,0,.25);
      transform:translateX(105%);transition:transform .3s ease;overflow:auto;--u:7px}
    .panel.open{transform:none}
    .panel .card{flex:none;margin-top:0;max-height:none}
    .winners{max-height:30vh}
    .plist{max-height:45vh}
    .drawer-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
    .scrim{display:block;position:fixed;inset:0;z-index:14;background:rgba(11,1,70,.4);animation:fade .3s}
  }
  /* celular horizontal: ruleta a la derecha, controles a la izquierda */
  @media (max-height:520px) and (orientation:landscape){
    :root{--u:1dvh}
    .stage{grid-template-columns:minmax(0,1fr) calc(100dvh - var(--u)*5);grid-template-rows:auto minmax(0,1fr);
      grid-template-areas:"brand wheel" "ctrl wheel";padding:calc(var(--u)*3) 3vw}
    .brand{padding-right:0;padding-top:calc(var(--u)*15)}
    .logo{height:calc(var(--u)*13)}
    h1{font-size:calc(var(--u)*7)}
    .tools{left:3vw;right:auto;top:calc(var(--u)*3)}
    .ctrl{align-self:end}
  }
  /* al girar, la ruleta queda sola: lo de la izquierda sale a la izquierda y lo de la derecha a la derecha */
  .brand,.ctrl,.win,.parts,.tools{transition:transform .55s cubic-bezier(.3,1.25,.5,1),opacity .4s ease}
  .stage.girando .brand,.stage.girando .ctrl,.stage.girando .win,.stage.girando .parts,.stage.girando .tools{
    opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.5,0,.75,0),opacity .35s ease}
  .stage.girando .brand,.stage.girando .ctrl,.stage.girando .win{transform:translateX(-110%)}
  .stage.girando .parts,.stage.girando .tools{transform:translateX(110%)}

  /* entrada desde el inicio: la cortina verde se desvanece y la ruleta llega girando */
  html.entrada body::after{content:"";position:fixed;inset:0;z-index:50;background:#56b167;pointer-events:none;animation:cortina .7s ease-out forwards}
  @keyframes cortina{to{opacity:0;visibility:hidden}}
  html.entrada .wheel-area{animation:llega 1.2s cubic-bezier(.2,1.25,.4,1) .1s both}
  @keyframes llega{from{transform:scale(.15) rotate(-300deg);opacity:0}to{transform:none;opacity:1}}
  html.entrada .brand,html.entrada .ctrl,html.entrada .win{animation:desdeIzq .7s cubic-bezier(.2,1.3,.4,1) .45s both}
  html.entrada .parts,html.entrada .tools{animation:desdeDer .7s cubic-bezier(.2,1.3,.4,1) .55s both}
  @keyframes desdeIzq{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes desdeDer{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel">
const { useState, useRef, useEffect, useMemo, useCallback } = React;

/* ============================================================
   ⚙️ CONFIGURACIÓN — edita aquí los textos
   (inscritos, premios y ganadores vienen del servidor: ver config.html)

const CONFIG = {
  titulo: "¡Gran Fiesta de Fin de Año 2026!",
  subtitulo: "Gira la ruleta y descubre quién es el próximo ganador 🎄",
  // colores de marca Soluciones Hospitalarias de la Costa

/* ============================================================
   🎲 Aleatoriedad justa: números criptográficos + muestreo por
   rechazo (sin sesgo de módulo). Cada participante = 1/N exacto.
   ============================================================ */
function randomInt(n) {
  const max = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= max);
  return buf[0] % n;
}

const TAU = 360;
const indexAt = (rot, n) => {
  const a = (((TAU - (rot % TAU)) % TAU) + TAU) % TAU; // ángulo bajo la flecha
  return Math.floor(a / (TAU / n)) % n;
};

/* ---------- Sonido: efectos compartidos en sonidos.js (Web Audio, sin archivos) ---------- */

/* ---------- Fondo de partículas ---------- */

/* ---------- Confeti (canvas) ---------- */
function Confetti({ fire }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!fire) return;
    const canvas = ref.current; const ctx = canvas.getContext("2d");
    canvas.width = innerWidth; canvas.height = innerHeight;
    const colors = ["#56b167", "#a3c91d", "#0b0146", "#ffffff", "#7fca8c", "#c9e27a"];
    const parts = [];
    const burst = (x, y, count) => {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, s = 5 + Math.random() * 11;
        parts.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6,
          w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
          r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
          c: colors[(Math.random() * colors.length) | 0], life: 1,
        });
      }
    };
    burst(innerWidth * 0.5, innerHeight * 0.45, 160);
    const t1 = setTimeout(() => burst(innerWidth * 0.2, innerHeight * 0.5, 90), 250);
    const t2 = setTimeout(() => burst(innerWidth * 0.8, innerHeight * 0.5, 90), 450);
    const t3 = setTimeout(() => burst(innerWidth * 0.5, innerHeight * 0.3, 120), 800);
    let raf;
    const loop = () => {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of parts) {
        p.vy += 0.22; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.0045;
        const cos = Math.cos(p.r), sin = Math.sin(p.r);
        ctx.setTransform(cos, sin, -sin, cos, p.x, p.y);  // trasladar + rotar sin save/restore
        ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      for (let i = parts.length - 1; i >= 0; i--)
        if (parts[i].life <= 0 || parts[i].y > canvas.height + 40) parts.splice(i, 1);
      if (parts.length) raf = requestAnimationFrame(loop);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
    loop();
    return () => { cancelAnimationFrame(raf); clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, [fire]);
  return <canvas ref={ref} className="confetti" />;
}

/* ---------- Ruleta (SVG) ---------- */
const C = 300;          // centro
const R_WHEEL = 262;    // radio de los segmentos
const polar = (r, deg) => {
  const a = (deg * Math.PI) / 180;
  return [C + r * Math.sin(a), C - r * Math.cos(a)];
};

/* Rendimiento: la ruleta va en capas HTML separadas. Solo el disco gira (transform en un <div>,
   lo mueve la GPU sin redibujar) y los bombillos parpadean con opacidad de capa. Los filtros/sombras
   quedan en capas estáticas que se pintan una sola vez. */
const BULBS = Array.from({ length: 28 }, (_, i) => polar(284, (i * TAU) / 28));
const bulbLayer = (cls, pick, fill, glow) => (
  <svg className={"w-layer " + cls} viewBox="0 0 600 600" aria-hidden="true">
    {BULBS.filter((_, i) => pick(i)).map(([x, y], i) => (
      <circle key={i} cx={x} cy={y} r="6" fill={fill} style={glow ? { filter: "drop-shadow(0 0 4px rgba(255,255,255,.8))" } : null} />
    ))}
  </svg>
);
// capas fijas: se crean una sola vez
const RIM = (
  <svg className="w-layer" viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stopColor="#a3c91d" /><stop offset="50%" stopColor="#56b167" />
        <stop offset="100%" stopColor="#2e6e3b" />
      </linearGradient>
    </defs>
    <circle cx={C} cy={C} r="298" fill="url(#rim)" />
    <circle cx={C} cy={C} r="272" fill="#0b0146" />
    {BULBS.map(([x, y], i) => <circle key={i} cx={x} cy={y} r="6" fill="#a3c91d" opacity=".55" />)}
  </svg>
);
const BULBS_A = bulbLayer("bulbs", (i) => i % 2, "#ffffff", true);
const BULBS_B = bulbLayer("bulbs bulbs-b", (i) => !(i % 2), "#ffffff", true);
const HUB = (
  <svg className="w-layer" viewBox="0 0 600 600" aria-hidden="true">
    <circle cx={C} cy={C} r="56" fill="#ffffff" stroke="#56b167" strokeWidth="6"
            style={{ filter: "drop-shadow(0 4px 8px rgba(0,0,0,.35))" }} />
    <image href={ICONO} x={C - 38} y={C - 38} width="76" height="76" />
  </svg>
);
const POINTER = (
  <svg viewBox={`${C - 30} -10 60 80`} aria-hidden="true">
    <path d={`M${C},64 L${C - 24},14 Q${C},-6 ${C + 24},14 Z`} fill="#0b0146" stroke="#fff" strokeWidth="4"
          strokeLinejoin="round" style={{ filter: "drop-shadow(0 4px 6px rgba(0,0,0,.4))" }} />
    <circle cx={C} cy="22" r="7" fill="#a3c91d" />
  </svg>
);

const Wheel = React.memo(function Wheel({ prizes, wheelRef, pointerRef, spinning, dragging, dragProps }) {
  const disc = useMemo(() => <Disc prizes={prizes} />, [prizes]);
  return (
    <div className={"wheel-wrap" + (spinning ? " fast" : "") + (dragging ? " dragging" : "")}
         role="img" aria-label="Ruleta de participantes" {...dragProps}>
      {RIM}{BULBS_A}{BULBS_B}
      <div ref={wheelRef} className="w-layer disc">{disc}</div>
      {HUB}
      <div ref={pointerRef} className="pointer">{POINTER}</div>
    </div>
  );
});

function Disc({ prizes: reales }) {
  // sin lista todavía: se dibuja una ruleta vacía de 8 segmentos
  const prizes = reales.length >= 2 ? reales : Array(8).fill("");
  const n = prizes.length;
  const s = TAU / n;
  const arc = (2 * Math.PI * 150 * s) / TAU;      // ancho disponible del segmento
  const fs = Math.max(6, Math.min(28, arc * 0.66));
  const SPACE = 178;                               // largo radial disponible para el nombre
  // nombre largo: primero se achica la letra (hasta 60%), solo después se corta con "…"
  const sizeFor = (t) => Math.max(fs * 0.6, Math.min(fs, SPACE / (t.length * 0.45)));
  const cut = (t) => { const m = Math.floor(SPACE / (sizeFor(t) * 0.45)); return t.length > m ? t.slice(0, m - 1) + "…" : t; };
  const colors = CONFIG.colores;

  const segColor = (i) => {
    let c = colors[i % colors.length];
    if (i === n - 1 && n > 1 && c === colors[0]) c = colors[(i + 1) % colors.length];
    return c;
  };
  const light = (hex) => {
    const v = parseInt(hex.slice(1), 16);
    const l = 0.299 * (v >> 16) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255);
    return l > 150;
  };

  return (
      <svg viewBox="0 0 600 600" aria-hidden="true">
        <defs>
          <radialGradient id="shade" cx="50%" cy="50%" r="50%">
            <stop offset="60%" stopColor="rgba(0,0,0,0)" /><stop offset="100%" stopColor="rgba(0,0,0,.18)" />
          </radialGradient>
        </defs>
        <g>
          {prizes.map((p, i) => {
            const a0 = i * s, a1 = (i + 1) * s, mid = a0 + s / 2;
            const [x0, y0] = polar(R_WHEEL, a0), [x1, y1] = polar(R_WHEEL, a1);
            const col = segColor(i);
            return (
              <g key={i + p}>
                <path d={`M${C},${C} L${x0},${y0} A${R_WHEEL},${R_WHEEL} 0 ${s > 180 ? 1 : 0} 1 ${x1},${y1} Z`}
                      fill={col} stroke="#ffffff" strokeWidth={n > 40 ? 1 : 2.5} />
                <g transform={`rotate(${mid - 90} ${C} ${C})`}>
                  <text x={C + R_WHEEL - 20} y={C} textAnchor="end" dominantBaseline="central"
                        fontFamily="'Barlow Condensed', sans-serif" fontWeight="600" fontSize={sizeFor(p)}
                        fill={light(col) ? "#0b0146" : "#ffffff"}>
                    {cut(p)}
                  </text>
                </g>
              </g>
            );
          })}
          <circle cx={C} cy={C} r={R_WHEEL} fill="url(#shade)" pointerEvents="none" />
        </g>
      </svg>
  );
}

/* ---------- Pantalla del ganador: letras gigantes con zoom ---------- */
function WinnerScreen({ winner, onClose, guardando }) {
  const nombre = winner.name.toUpperCase();
  const palabras = nombre.split(/\s+/).filter(Boolean);
  const L = nombre.length;
  // nombres cortos en 1 línea gigante; largos en 2-3 líneas. Tamaño limitado por alto y por ancho.
  const lineas = L <= 14 ? 1 : L <= 30 ? 2 : 3;
  const porLinea = Math.max(Math.ceil(L / lineas), ...palabras.map((p) => p.length));
  const fontSize = `min(${[30, 21, 15][lineas - 1]}vh, ${(92 / (porLinea * 0.52)).toFixed(2)}vw)`;
  const PASO = 0.06;                                   // segundos entre letra y letra
  const giros = useMemo(() => Array.from({ length: L }, () => Math.round((Math.random() - 0.5) * 60)), [L]);
  const land = (palabras.join("").length - 1) * PASO + 0.55;
  useEffect(() => { const t = setTimeout(Sonidos.impacto, land * 1000); return () => clearTimeout(t); }, []);
  let k = 0;
  return (
    <div className="overlay" onClick={onClose} style={{ "--land": land + "s" }}>
      <img className="win-icon" src={ICONO} alt="" />
      <div className="win-kicker">¡Tenemos ganador!</div>
      <h2 className="win-name" style={{ fontSize }} aria-label={winner.name}>
        {palabras.map((p, wi) => (
          <span className="w" key={wi} aria-hidden="true">
            {[...p].map((c, ci) => {
              const i = k++;
              return <span className="ch" key={ci} style={{ "--d": i * PASO + "s", "--r": giros[i] + "deg" }}>{c}</span>;
            })}
          </span>
        ))}
      </h2>
      {winner.premio && <div className="win-gift">🎁 {winner.premio}</div>}
      <button className="win-btn" onClick={(e) => { e.stopPropagation(); Sonidos.pop(); onClose(); }} autoFocus disabled={guardando}>{guardando ? "Guardando…" : "Continuar"}</button>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [datos, setDatos] = useState({ asistentes: [], premios: [], ganadores: [] });
  const [premioSel, setPremioSel] = useState(null);  // premio elegido a mano (si no, el primero con unidades)
  const [error, setError] = useState("");
  const [cargado, setCargado] = useState(false);
  const [guardando, setGuardando] = useState(false);
  const [spinning, setSpinning] = useState(false);
  const [winner, setWinner] = useState(null);      // { name, cedula, premioId, premio }
  const [fire, setFire] = useState(0);
  const [muted, setMuted] = useState(Sonidos.silencio);
  useEffect(() => { Sonidos.setSilencio(muted); }, [muted]);
  // llegada desde EMPEZAR (suena si el navegador ya permite audio en este sitio)
  useEffect(() => { if (window.__entrada) Sonidos.llegada(); }, []);
  const [theme, setTheme] = useState(document.documentElement.dataset.theme);
  const [drawer, setDrawer] = useState(false);
  // lista de participantes plegable (se recuerda en este navegador); oculta tampoco se dibuja
  const [verLista, setVerLista] = useState(() => { try { return localStorage.getItem("ruleta-lista") !== "oculta"; } catch (e) { return true; } });
  useEffect(() => { try { localStorage.setItem("ruleta-lista", verLista ? "visible" : "oculta"); } catch (e) {} }, [verLista]);

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem("ruleta-tema", theme); } catch (e) {}
  }, [theme]);

  /* ---------- quién participa en el premio actual ---------- */
  const { premios, premio, elegibles } = useMemo(() => {
    const gano = new Set(datos.ganadores.map((g) => g.cedula));
    const premios = datos.premios.map((p) => {
      const entregados = datos.ganadores.filter((g) => g.premioId === p.id).length;
      return { ...p, entregados, restantes: p.cantidad - entregados };
    });
    const premio = premios.find((p) => p.id === premioSel && p.restantes > 0) || premios.find((p) => p.restantes > 0) || null;
    const elegibles = datos.asistentes.filter((a) => !gano.has(a.cedula) && !(premio && premio.excluidos.includes(a.cedula)));
    return { premios, premio, elegibles };
  }, [datos, premioSel]);

  // nombres en la ruleta; si dos personas se llaman igual se distinguen con el final de la cédula
  const clave = elegibles.map((a) => a.cedula).join("|");
  const prizes = useMemo(() => {
    const cuenta = {};
    elegibles.forEach((a) => { cuenta[a.nombre] = (cuenta[a.nombre] || 0) + 1; });
    return elegibles.map((a) => (cuenta[a.nombre] > 1 ? `${a.nombre} (…${a.cedula.slice(-3)})` : a.nombre));
  }, [clave]);

  const wheelRef = useRef(null);
  const pointerRef = useRef(null);
  const rot = useRef(0);
  const anim = useRef(null);
  const drag = useRef(null);                         // { a: ángulo, t: tiempo, v: velocidad °/ms } mientras se arrastra
  const [dragging, setDragging] = useState(false);
  const nRef = useRef(0);
  const lastIdx = useRef(0);
  const elegRef = useRef(elegibles);
  const premioRef = useRef(premio);
  nRef.current = prizes.length; elegRef.current = elegibles; premioRef.current = premio;
  const nombreRef = useRef(null);
  const labelsRef = useRef(prizes); labelsRef.current = prizes;
  const mostrado = useRef({ idx: -1, lista: null });

  /* ---------- datos del servidor ---------- */
  const latest = useRef({});
  const firmaRef = useRef("");
  const cargar = useCallback(async () => {
    try {
      const d = await api("estado");
      // nunca cambiar la lista mientras gira o mientras se muestra un ganador
      if (anim.current || latest.current.winner) return;
      // misma respuesta que la anterior: no se toca el estado (evita re-renders cada 5 s)
      const firma = JSON.stringify(d);
      if (firma !== firmaRef.current) { firmaRef.current = firma; setDatos(d); }
      setError(""); setCargado(true);
    } catch (e) { setError(e.message); }
  }, []);
  useEffect(() => {
    cargar();
    const t = setInterval(() => { if (!document.hidden && !anim.current && !latest.current.winner) cargar(); }, 5000);
    return () => clearInterval(t);
  }, [cargar]);

  const flick = () => {
    const el = pointerRef.current; if (!el || !el.animate) return;
    el.animate(
      [{ transform: "rotate(0deg)" }, { transform: "rotate(-26deg)" }, { transform: "rotate(0deg)" }],
      { duration: 130, easing: "ease-out" }
    );
  };

  /* bucle de animación continuo */
  useEffect(() => {
    let raf, last = performance.now();
    // nombre bajo la flecha: solo se toca el DOM cuando cambia el nombre (sin re-render de React)
    const pintarNombre = (idx, gano) => {
      const el = nombreRef.current, lista = labelsRef.current, m = mostrado.current;
      if (!el || (idx === m.idx && lista === m.lista && !gano)) return;
      mostrado.current = { idx, lista };
      el.textContent = lista.length >= 2 ? lista[idx] || "" : "";
      el.classList.toggle("gano", !!gano);
    };
    const frame = (now) => {
      const dt = Math.min(now - last, 50); last = now;
      const a = anim.current;
      if (a) {
        const t = Math.min((now - a.start) / a.dur, 1);
        const e = 1 - Math.pow(1 - t, 4);             // easeOutQuart: arranca rápido, frena suave
        rot.current = a.from + a.total * e;
        const idx = indexAt(rot.current, nRef.current);
        if (idx !== lastIdx.current) { lastIdx.current = idx; flick(); audio.tick(); }
        if (t >= 1) {
          anim.current = null;
          const final = indexAt(rot.current, nRef.current);
          const ganador = elegRef.current[final];
          pintarNombre(final, true);
          const p = premioRef.current;
          setSpinning(false);
          setWinner({ name: ganador.nombre, cedula: ganador.cedula, premioId: p.id, premio: p.nombre });
          setFire((f) => f + 1);
          audio.fanfare();
        }
      } else {
        if (!drag.current && !latest.current.winner) rot.current += dt * 0.004;  // giro lento de reposo (pausado con el ganador en pantalla)
        const idx = indexAt(rot.current, nRef.current);
        if (drag.current && idx !== lastIdx.current) { flick(); audio.tick(); }
        lastIdx.current = idx;
      }
      pintarNombre(lastIdx.current);
      if (wheelRef.current) wheelRef.current.style.transform = `rotate(${rot.current}deg)`;
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, []);

  const spin = useCallback((dir = 1, speed = 0) => {
    const n = nRef.current;
    if (anim.current || n < 2 || winner || !premioRef.current) return;
    audio.ensure();
    Sonidos.girar();
    setDrawer(false);
    const idx = randomInt(n);                          // 🎯 el ganador se decide aquí, 1/N para cada uno
    const s = TAU / n;
    const jitter = (Math.random() - 0.5) * s * 0.7;   // punto de parada dentro del segmento (solo estético)
    const targetMod = (((TAU - ((idx + 0.5) * s + jitter)) % TAU) + TAU) % TAU;
    const cur = ((rot.current % TAU) + TAU) % TAU;
    const delta = dir > 0 ? (targetMod - cur + TAU) % TAU : (cur - targetMod + TAU) % TAU;
    const vueltas = speed ? 4 + Math.min(Math.round(speed * 2.5), 6) : 6; // lanzamiento más fuerte = más vueltas
    const total = dir * (TAU * (vueltas + Math.floor(Math.random() * 3)) + delta);
    anim.current = { start: performance.now(), from: rot.current, total, dur: 7000 + Math.random() * 1500 };
    setSpinning(true);
  }, [winner]);

  /* arrastrar con mouse o dedo; soltar rápido = girar */
  const angleOf = (e, el) => {
    const r = el.getBoundingClientRect();
    return Math.atan2(e.clientX - (r.left + r.width / 2), (r.top + r.height / 2) - e.clientY) * 180 / Math.PI;
  };
  // valores actuales para manejadores estables (así la ruleta memorizada no se vuelve a renderizar)
  latest.current = { spin, winner, ensure: audio.ensure };
  const dragProps = useMemo(() => {
    const endDrag = () => {
      const d = drag.current; if (!d) return;
      drag.current = null; setDragging(false);
      const quieto = performance.now() - d.t > 120;  // se detuvo antes de soltar
      if (!quieto && Math.abs(d.v) > 0.35) latest.current.spin(Math.sign(d.v), Math.abs(d.v));
    };
    return {
    onPointerDown: (e) => {
      if (anim.current || latest.current.winner || nRef.current < 2) return;
      latest.current.ensure();
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      drag.current = { a: angleOf(e, e.currentTarget), t: performance.now(), v: 0 };
      setDragging(true);
    },
    onPointerMove: (e) => {
      const d = drag.current; if (!d) return;
      const a = angleOf(e, e.currentTarget), now = performance.now();
      const da = ((a - d.a + 540) % 360) - 180;       // diferencia en [-180, 180)
      rot.current += da;
      d.v = d.v * 0.5 + (da / Math.max(now - d.t, 1)) * 0.5;
      d.a = a; d.t = now;
    },
    onPointerUp: endDrag,
    onPointerCancel: endDrag,
    };
  }, []);

  /* barra espaciadora */
  useEffect(() => {
    const onKey = (e) => {
      if (e.code === "Space" && !/TEXTAREA|INPUT|BUTTON|SELECT/.test(document.activeElement.tagName)) {
        e.preventDefault(); spin();
      }
      if (e.key === "Escape") setDrawer(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [spin]);

  // el ganador se guarda en el servidor antes de cerrar; si falla por conexión, la pantalla queda para reintentar
  const closeModal = async () => {
    if (!winner || guardando) return;
    setGuardando(true);
    try {
      const d = await api("ganador", { method: "POST", body: { premioId: winner.premioId, cedula: winner.cedula } });
      latest.current.winner = null;
      firmaRef.current = JSON.stringify(d); setDatos(d); setWinner(null); setError("");
    } catch (e) {
      if (e.status === 409) {                         // el servidor lo rechaza (p. ej. el premio se borró): no sirve reintentar
        alert("No se registró el ganador: " + e.message);
        latest.current.winner = null; setWinner(null); cargar();
      } else {
        alert("No se pudo guardar el ganador (" + e.message + ").\nRevisa la conexión y pulsa Continuar otra vez.");
      }
    } finally { setGuardando(false); }
  };

  const n = prizes.length;
  const pendientes = premios.filter((p) => p.restantes > 0);
  const ganadores = datos.ganadores;
  const textoBoton = spinning ? "GIRANDO…" : !cargado ? "CARGANDO…" : !premio ? (premios.length ? "PREMIOS ENTREGADOS" : "CONFIGURA PREMIOS")
    : n < 2 ? "FALTAN PARTICIPANTES" : "¡GIRAR!";

  return (
    <>
      <Particles />
      <main className={"stage" + (spinning ? " girando" : "")}>
        <div className="tools">
          <button className="icon-btn" onClick={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
                  title="Cambiar tema" aria-label="Cambiar tema">{theme === "dark" ? "☀️" : "🌙"}</button>
          <button className="icon-btn" onClick={() => setMuted((m) => !m)}
                  title="Sonido" aria-label="Sonido">{muted ? "🔇" : "🔊"}</button>
          <button className="icon-btn menu" onClick={() => setDrawer(true)}
                  title="Panel" aria-label="Abrir panel">☰</button>
        </div>

        <header className="brand">
          <img className="logo" src={LOGO} alt="Soluciones Hospitalarias de la Costa S.A.S" />
          <h1>{CONFIG.titulo}</h1>
          {CONFIG.subtitulo && <p className="sub">{CONFIG.subtitulo}</p>}
        </header>

        <section className="wheel-area">
          <div className="wheel-box">
            <Wheel prizes={prizes} wheelRef={wheelRef} pointerRef={pointerRef} spinning={spinning}
                   dragging={dragging} dragProps={dragProps} />
          </div>
          <div className="nombre-actual" ref={nombreRef} aria-hidden="true"></div>
        </section>

        <section className="ctrl">
          <label className="premio-actual">
            <span className="lbl">🎁 Sorteando</span>
            {pendientes.length
              ? <select value={premio ? premio.id : ""} onChange={(e) => { setPremioSel(e.target.value); Sonidos.pop(); }} disabled={spinning || !!winner}
                        aria-label="Premio que se sortea">
                  {pendientes.map((p) => (
                    <option key={p.id} value={p.id}>{p.nombre}{p.cantidad > 1 ? ` · ${p.entregados + 1} de ${p.cantidad}` : ""}</option>
                  ))}
                </select>
              : <a className="sin-premio" href="config.html">{premios.length ? "🎉 Todos entregados" : "Configura los premios →"}</a>}
          </label>
          <button className="spin-btn" onClick={() => spin()} disabled={spinning || n < 2 || !!winner || !premio}>
            {textoBoton}
          </button>
        </section>

        <div className={"panel" + (drawer ? " open" : "")}>
          <div className="drawer-head">
            Panel
            <button className="icon-btn" onClick={() => setDrawer(false)} aria-label="Cerrar">✕</button>
          </div>
          <div className="card win">
            <h2>🏆 Ganadores {ganadores.length > 0 && <span className="badge">{ganadores.length}</span>}</h2>
            {ganadores.length === 0
              ? <p className="empty">Aún no hay ganadores.</p>
              : <ul className="winners">
                  {[...ganadores].reverse().map((g, i) => (
                    <li key={g.cedula}>
                      <span className="n">{ganadores.length - i}</span>
                      <span className="t">{g.nombre}<small>🎁 {g.premio}</small></span>
                      <span className="h">{new Date(g.hora).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}</span>
                    </li>
                  ))}
                </ul>}
          </div>

          <div className="card parts">
            <h2>👥 Participan <span className="badge">{n}</span>
              <button className="plegar" onClick={() => setVerLista((v) => !v)} aria-expanded={verLista}
                      title={verLista ? "Ocultar lista" : "Mostrar lista"}>{verLista ? "Ocultar ▴" : "Mostrar ▾"}</button>
            </h2>
            {error && <p className="err" role="alert">⚠️ {error}</p>}
            {premio && <p className="empty">en «{premio.nombre}»</p>}
            {verLista && <ul className="plist">
              {prizes.map((nombre, i) => <li key={elegibles[i].cedula}>{nombre}</li>)}
            </ul>}
            <div className="row">
              <a className="btn" href="config.html">⚙️ Configurar</a>
              <a className="btn ghost" href="index.html">📱 Inicio (QR)</a>
            </div>
          </div>
        </div>
        {drawer && <div className="scrim" onClick={() => setDrawer(false)} />}
      </main>

      {winner && <WinnerScreen winner={winner} onClose={closeModal} guardando={guardando} />}
      <Confetti fire={fire} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
