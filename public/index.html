<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscripción · Ruleta de Fin de Año</title>
<link rel="icon" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marca.css">
<script src="comun.js"></script>
<script src="vendor/qrcode.min.js"></script>
<style>
  html,body{height:100%;overflow:hidden}
  .wrap{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5vh 6vw;align-items:center;padding:5vh 6vw}
  .info{display:flex;flex-direction:column;gap:3vh;min-width:0}
  .info .logo{height:10vh;align-self:flex-start}
  h1{font-size:7.5vh;line-height:1;color:var(--navy)}
  :root[data-theme="dark"] h1{color:#fff}
  .paso{font-size:3.4vh;color:var(--muted);line-height:1.25}
  .paso b{color:var(--text)}
  .contador{display:flex;align-items:baseline;gap:1.5vh}
  .contador .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16vh;line-height:.9;color:var(--green)}
  .contador .t{font-size:3.4vh;font-weight:600}

  /* botón EMPEZAR: mismo estilo que GIRAR, con aro de pulso (solo transform/opacity) */
  .empezar{position:relative;align-self:flex-start;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:5vh;letter-spacing:.1em;
    color:#fff;border:none;border-radius:999px;padding:1.4vh 7vh;cursor:pointer;
    background:linear-gradient(180deg,#7fca8c,var(--green) 50%,var(--green-d));
    box-shadow:0 .8vh 0 var(--green-dd),0 1.6vh 3vh rgba(11,1,70,.25),inset 0 2px 0 rgba(255,255,255,.45);
    text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .12s,filter .2s}
  .empezar::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    border:.6vh solid rgba(86,177,103,.6);animation:pulso 2s ease-out infinite}
  @keyframes pulso{0%{transform:scale(1);opacity:1}70%,100%{transform:scale(1.12,1.5);opacity:0}}
  .empezar:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .empezar:active{transform:translateY(.6vh);box-shadow:0 .2vh 0 var(--green-dd)}
  .empezar:focus-visible{outline:3px solid var(--lime);outline-offset:4px}

  .qr-card{background:#fff;border-radius:3vh;padding:3vh;box-shadow:0 2vh 6vh rgba(11,1,70,.2);text-align:center;border:.6vh solid var(--green)}
  .qr{width:min(62vh,42vw);aspect-ratio:1}
  .qr svg{width:100%;height:100%;display:block}
  .tools{position:fixed;top:2.5vh;right:2.5vw;display:flex;gap:8px}
  .estado{position:fixed;bottom:2vh;left:6vw;font-size:14px}

  /* salida hacia la ruleta: el contenido se va y una cortina verde crece desde el botón */
  .saliendo .info{animation:salirIzq .5s cubic-bezier(.5,0,.75,0) forwards}
  .saliendo .qr-card{animation:salirQR .55s cubic-bezier(.5,0,.75,0) .05s forwards}
  .saliendo .tools{animation:desvanecer .3s forwards}
  @keyframes salirIzq{to{transform:translateX(-30vw);opacity:0}}
  @keyframes salirQR{to{transform:scale(.2) rotate(25deg);opacity:0}}
  @keyframes desvanecer{to{opacity:0}}
  .cortina{position:fixed;z-index:50;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#56b167;
    pointer-events:none;transform:scale(0);animation:cubrir .6s cubic-bezier(.6,0,.4,1) .2s forwards}
  @keyframes cubrir{to{transform:scale(var(--s))}}

  @media (max-aspect-ratio:1/1){
    html,body{overflow:auto}
    .wrap{grid-template-columns:1fr;height:auto;min-height:100dvh;padding:80px 20px 40px}
    h1{font-size:38px} .paso{font-size:18px} .info .logo{height:56px}
    .contador .n{font-size:80px} .contador .t{font-size:18px}
    .empezar{font-size:26px;padding:12px 40px}
    .qr{width:min(80vw,420px)}
    .tools{top:16px;right:16px}
  }
</style>
</head>
<body>
<div class="tools">
  <button class="icon-btn" onclick="alternarTema()" title="Cambiar tema" aria-label="Cambiar tema">🌓</button>
  <a class="btn ghost" href="config.html">⚙️ Configuración</a>
</div>
<main class="wrap">
  <section class="info">
    <img class="logo" src="logo.png" alt="Soluciones Hospitalarias de la Costa S.A.S">
    <h1>¡Inscríbete en la ruleta!</h1>
    <p class="paso">Escanea el código con la cámara de tu celular y escribe <b>tu nombre y cédula</b>.</p>
    <div class="contador" aria-live="polite"><span class="n" id="n">–</span><span class="t">inscritos</span></div>
    <button class="empezar" id="empezar" type="button">¡EMPEZAR! 🎡</button>
  </section>
  <section class="qr-card">
    <div class="qr" id="qr" role="img" aria-label="Código QR para inscribirse"></div>
  </section>
</main>
<p class="estado muted" id="estado"></p>
<script>
  const destino = location.origin + "/inscripcion.html";
  const qr = qrcode(0, "M"); qr.addData(destino); qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });

  async function actualizar() {
    try {
      const { asistentes } = await api("estado");
      document.getElementById("n").textContent = asistentes.length;
      document.getElementById("estado").textContent = "";
    } catch (e) {
      document.getElementById("estado").textContent = "⚠️ " + e.message;
    }
  }
  actualizar();
  const sondeo = setInterval(() => { if (!document.hidden) actualizar(); }, 4000);

  // EMPEZAR: animación de salida y la ruleta entra con su propia animación (#jugar)
  document.getElementById("empezar").addEventListener("click", (ev) => {
    clearInterval(sondeo);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { location.href = "ruleta.html#jugar"; return; }
    const r = ev.currentTarget.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const radio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const c = document.createElement("div");
    c.className = "cortina";
    c.style.cssText = `left:${x}px;top:${y}px;--s:${(radio * 2) / 40 + 1}`;
    document.body.append(c);
    document.body.classList.add("saliendo");
    const ir = () => { location.href = "ruleta.html#jugar"; };
    c.addEventListener("animationend", ir);
    setTimeout(ir, 1200);  // por si el navegador pausa la animación (pestaña en segundo plano)
  });
</script>
</body>
</html>
