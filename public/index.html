<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscripción · Ruleta de Fin de Año</title>
<link rel="icon" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marca.css">
<script src="comun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  html,body{height:100%;overflow:hidden}
  .wrap{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5vh 6vw;align-items:center;padding:5vh 6vw}
  .info{display:flex;flex-direction:column;gap:3vh;min-width:0}
  .info .logo{height:10vh;align-self:flex-start}
  h1{font-size:7.5vh;line-height:1;color:var(--navy)}
  :root[data-theme="dark"] h1{color:#fff}
  .paso{font-size:3.4vh;color:var(--muted);line-height:1.25}
  .paso b{color:var(--text)}
  .contador{display:flex;align-items:baseline;gap:1.5vh}
  .contador .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16vh;line-height:.9;color:var(--green)}
  .contador .t{font-size:3.4vh;font-weight:600}
  .ultimos{list-style:none;display:flex;flex-wrap:wrap;gap:1.2vh;max-height:16vh;overflow:hidden}
  .ultimos li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.7vh 2vh;font-size:2.4vh;font-weight:600;
    animation:entra .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes entra{from{opacity:0;transform:translateY(1.5vh) scale(.9)}to{opacity:1;transform:none}}
  .qr-card{background:#fff;border-radius:3vh;padding:3vh;box-shadow:0 2vh 6vh rgba(11,1,70,.2);text-align:center;border:.6vh solid var(--green)}
  .qr{width:min(62vh,42vw);aspect-ratio:1}
  .qr svg{width:100%;height:100%;display:block}
  .url{margin-top:1.5vh;font-size:2.3vh;font-weight:600;color:#0b0146;word-break:break-all}
  .tools{position:fixed;top:2.5vh;right:2.5vw;display:flex;gap:8px}
  .estado{position:fixed;bottom:2vh;left:6vw;font-size:14px}
  @media (max-aspect-ratio:1/1){
    html,body{overflow:auto}
    .wrap{grid-template-columns:1fr;height:auto;min-height:100dvh;padding:80px 20px 40px}
    h1{font-size:38px} .paso{font-size:18px} .info .logo{height:56px}
    .contador .n{font-size:80px} .contador .t{font-size:18px}
    .ultimos li{font-size:15px;padding:6px 12px}
    .qr{width:min(80vw,420px)} .url{font-size:14px}
    .tools{top:16px;right:16px}
  }
</style>
</head>
<body>
<div class="tools">
  <button class="icon-btn" onclick="alternarTema()" title="Cambiar tema" aria-label="Cambiar tema">🌓</button>
  <a class="btn ghost" href="config.html">⚙️ Configuración</a>
  <a class="btn" href="ruleta.html">🎡 Ir a la ruleta</a>
</div>
<main class="wrap">
  <section class="info">
    <img class="logo" src="logo.png" alt="Soluciones Hospitalarias de la Costa S.A.S">
    <h1>¡Inscríbete en la ruleta!</h1>
    <p class="paso">Escanea el código con la cámara de tu celular y escribe <b>tu nombre y cédula</b>.</p>
    <div class="contador" aria-live="polite"><span class="n" id="n">–</span><span class="t">inscritos</span></div>
    <ul class="ultimos" id="ultimos"></ul>
  </section>
  <section class="qr-card">
    <div class="qr" id="qr" role="img" aria-label="Código QR para inscribirse"></div>
    <div class="url" id="url"></div>
  </section>
</main>
<p class="estado muted" id="estado"></p>
<script>
  const destino = location.origin + "/inscripcion.html";
  const qr = qrcode(0, "M"); qr.addData(destino); qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  document.getElementById("url").textContent = destino.replace(/^https?:\/\//, "");

  let conocidos = new Set();
  async function actualizar() {
    try {
      const { asistentes } = await api("estado");
      document.getElementById("n").textContent = asistentes.length;
      const ul = document.getElementById("ultimos");
      const recientes = asistentes.slice(-12).reverse();
      ul.replaceChildren(...recientes.map((a) => {
        const li = document.createElement("li");
        li.textContent = a.nombre;
        if (conocidos.size && !conocidos.has(a.cedula)) li.style.animationDelay = "0s"; else li.style.animation = "none";
        return li;
      }));
      conocidos = new Set(asistentes.map((a) => a.cedula));
      document.getElementById("estado").textContent = "";
    } catch (e) {
      document.getElementById("estado").textContent = "⚠️ " + e.message;
    }
  }
  actualizar();
  setInterval(() => { if (!document.hidden) actualizar(); }, 4000);
</script>
</body>
</html>
